spring:
  application:
    name: springai-bootcamp-demo
  config:
    import: classpath:voyage.yaml
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:chatbot.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # chat.options.model is deprecated for removal since Spring AI 2.0.0, replaced by chat.model
        model: ${OLLAMA_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    mcp:
      server:
        name: long-voyage-mission-control
        version: 1.0.0
        # Must be set even though the metadata says it is the default: in Spring AI 2.0.2 the /mcp endpoint
        # is only registered for an explicit STREAMABLE, otherwise the deprecated SSE transport is used
        protocol: STREAMABLE
        instructions: >
          You are Mission Control for the generation ship Long Voyage. Start a voyage or use an existing
          voyage id, watch the ship, trigger events, send delayed transmissions and interview the crew.